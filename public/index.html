<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Luana Admin</title>
  <link rel="stylesheet" href="/index.css" />
</head>
<body>
  <div id="root"></div>

  <!-- ★ 全体エラーを画面に表示する仕込み ★ -->
  <style>
    #global-error {
      position: fixed;
      top: 0; left: 0;
      width: 100%;
      background: rgba(255,0,0,0.9);
      color: white;
      font-size: 16px;
      padding: 8px;
      z-index: 9999;
      white-space: pre-wrap;
    }
  </style>
  <div id="global-error" style="display:none;"></div>
  <script>
    // ページ全体の同期エラーをキャッチ
    window.addEventListener('error', e => {
      const el = document.getElementById('global-error');
      el.textContent = `Error: ${e.message}\n(${e.filename}:${e.lineno}:${e.colno})`;
      el.style.display = 'block';
    });
    // 非同期の unhandled promise rejection をキャッチ
    window.addEventListener('unhandledrejection', e => {
      const el = document.getElementById('global-error');
      el.textContent = `Promise Rejection: ${e.reason}`;
      el.style.display = 'block';
    });
  </script>

  <!-- React や他のスクリプトたち -->
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
