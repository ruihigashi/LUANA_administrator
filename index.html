<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./public/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Salon Admin Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- ↓↓↓ OneSignal SDK をここに追加 ↓↓↓ -->
    <script src="https://cdn.onesignal.com/sdks/OneSignalSDK.js" async=""></script>
    <script>
      window.OneSignal = window.OneSignal || [];
      OneSignal.push(() => {
        OneSignal.init({
          appId: "77599c03-f73a-4f35-b50f-532dc3689987",
          allowLocalhostAsSecureOrigin: true,
          notifyButton: { enable: true },
        });
      console.log("[OneSignal] init() 完了");
      // 強制的にネイティブプロンプト
      OneSignal.showNativePrompt();
      console.log("[OneSignal] showNativePrompt() 呼び出し");
      });
    </script>
    <!-- ↑↑↑ ここまで ↑↑↑ -->

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
